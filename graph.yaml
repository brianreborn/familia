nodes:

  qodesh-gpu-decision:
    model: stories15m-fp32
    host: qodesh
    runtime: sm11-legacy-qodesh
    ctx: 256
    parallel: 1
    kv_type: f32
    flash_attn: false
    offload: {backend: cuda-sm11-ptx, ngl: 99, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 18100
    cache_ram_mib: 64
    status: active

  qodesh-smol-cpu:
    model: smollm2-135m-q4
    host: qodesh
    runtime: llama-b11540-win-cpu
    ctx: 2048
    override_reasons:            # model card / model-database deviations (#51)
      ctx: "15-year-old qodesh (Athlon II X2, 1 thread beside the 8600 GT feeder): decision prompts are short, so 2048 keeps KV and prefill small; the card's 8192 was not measured here"
    threads: 1                   # measured 2026-10-10: 1 thread pinned CPU0 + GPU node on CPU1 = ~30 tok/s combined; -t 2 starves the GPU feeder
    parallel: 1
    kv_type: q8_0
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 18101
    cache_ram_mib: 256
    status: planned
    escalates_to: [coder, qodesh-resident]   # docs/escalation.md: fastest measured first (miryam coder 17.4 t/s vs 0.91 here)
    escalation: {mode: suggest}              # coder crosses host: needs first-time consent

  miryam-gpu-decision:
    model: smollm2-135m-q4-miryam
    host: miryam
    runtime: llama-b11541-linux-vulkan
    ctx: 2048
    override_reasons:            # model card / model-database deviations (#51)
      ctx: "decision prompts are short; 2048 keeps the Vulkan KV small on the shared-memory HD 620 beside the coder on 7.1 GiB miryam; 8192 not measured"
    parallel: 1
    kv_type: q8_0
    flash_attn: false
    offload: {backend: vulkan, ngl: 99, split: none, main_gpu: 0}   # HD 620 verified; slower than CPU, frees CPU for the coder
    bind: 127.0.0.1
    port: 18111
    cache_ram_mib: 64
    status: planned
    escalates_to: [coder]                    # same host; docs/escalation.md
    escalation: {mode: suggest}

  phone7-decision:
    model: smollm2-135m-q4-phone    # Q4_0 fastest tg on Xclipse 550 (102 vs 83 Q4_K_M vs 89 Q8_0 t/s, phone8 2026-10-10)
    host: phone7
    runtime: termux-llama-cpp-0.6.0
    ctx: 2048
    override_reasons:            # model card / model-database deviations (#51)
      ctx: "decision prompts are short; 2048 keeps KV inside phone7's RAM policy (reserve_ram_mib 5120, ~2.3 GiB left); 8192 not measured"
    parallel: 1
    kv_type: q8_0
    flash_attn: true             # pp128 1372 vs 1239 t/s, tg equal (phone8)
    offload: {backend: vulkan, ngl: 99, split: none, main_gpu: 0}   # Xclipse 550, verified
    bind: 127.0.0.1
    port: 18110
    cache_ram_mib: 64            # tiny; phone7 reserve_ram_mib 5120 leaves ~2.3 GiB
    status: planned              # launch via familia-start once the node is wired into the fleet

  phone8-general:
    model: qwen25-05b-q4km-phone
    host: phone8
    runtime: termux-llama-cpp-0.6.0
    ctx: 2048
    override_reasons:            # model card / model-database deviations (#51)
      ctx: "phone8 measured at 2048 (tg ~31-34 t/s, min MemAvailable 1945 MiB under reserve_ram_mib 5120); the card's 32768 was not measured on the phone"
    parallel: 1
    kv_type: f16
    flash_attn: true
    offload: {backend: vulkan, ngl: 99, split: none, main_gpu: 0}   # tg64 33.9 / tg128 30.8, pp128 508 t/s; CPU ngl 0 unusable (0.3 t/s)
    bind: 127.0.0.1
    port: 18112
    cache_ram_mib: 128           # min MemAvailable 1945 MiB during the run; reserve 5120
    status: planned
  coder:
    status: active
    model: qwen35-2b-q4km
    host: miryam
    runtime: llama-b11374
    ctx: 65536                   # total; per-slot = ctx / parallel
    override_reasons:            # model card / model-database deviations (#51)
      ctx: "miryam has 7270 MiB with a 3072 MiB reserve: at 262144 the q8_0 KV is ~1650 MiB and cache_ram must cover a slot's prompt state (~1650 MiB), about 2.4 GiB more than at 65536 (426 MiB KV); 65536 meets hermes min_ctx 64000"
    parallel: 1
    kv_type: q8_0
    flash_attn: true
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}   # iGPU measured worse + needs extra RAM (LESSONS L-miryam-perf)
