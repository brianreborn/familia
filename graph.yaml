# Declarative model/agent graph, typed schema v2 (see docs/graph-types.md, #19).
# Nothing is auto-selected and nothing has defaults: every field is explicit,
# and scripts/validate_graph.py fails loudly if the graph does not fit the
# measured hardware, the runtime's supported architectures, or the agents.
# Rule: a value we did not measure ourselves is never written as measured.
# Reported numbers go under `reported:` with a source; GPU vram_mib stays null
# until `measured: true`.
# Standing rule (2026-10-09 OOM): never aim for high RAM on small hosts — see docs/ram-safety.md.
version: 2

hosts:
  miryam:
    kind: laptop
    measured: true
    addr: 192.168.1.9            # measured on miryam (wlp2s0); transport PoC #22
    user: rcs
    port: 22
    os: linux
    cpu: Intel Core i5-7200U
    threads: 4
    ram_mib: 7270                # 7.1 GiB MemTotal
    # Standing rule (2026-10-09 OOM hard-hang): never aim for high RAM.
    # Keep ~2+ GiB free after estimated node use on hosts under 8 GiB. See docs/ram-safety.md.
    reserve_ram_mib: 3072        # OS + hermes-agent + browser + 3 GiB safety margin (was 2048)
    gpus:
      - vendor: intel
        model: Intel HD Graphics 620 (KBL GT2, integrated)
        vram_mib: 0              # shared-memory iGPU; Vulkan reports 5467 MiB shared
        backend: vulkan
        backend_status: verified # 2026-10-10 02:47 PT, SmolLM2-135M Q4_0 -ngl 99, identical output to CPU at temp 0
        driver: Mesa 26.0.8 Intel Vulkan
        compute_capability: null
        measured: true
        notes: >-
          SmolLM2-135M Q4_0: CPU -t2 pp64 430.4 / tg32 101.4 t/s; Vulkan -ngl 99 pp64 320.0 / tg32 46.2 t/s
          (the iGPU is slower than the CPU for this model). Concurrency 2026-10-10 08:40 PT with
          llama-b11541: CPU stand-in coder LFM2.5-1.2B Q4_K_M -t3 alone pp128 43.5 / tg64 13.9, Vulkan SmolLM2 Q4_0
          -t1 alone pp128 325.8 / tg64 45.8; together CPU pp128 26.9 / tg64 14.7, Vulkan pp128 134.4 / tg64 16.9;
          min MemAvailable 3160 MiB. Real coder (Qwen3.5-2B, 64k ctx) not run: would leave under 3 GiB free.
  qodesh:
    kind: desktop
    measured: true               # measured 2026-10-09 20:36 PT
    addr: 192.168.1.2            # OpenSSH client only (no sshd, no rsync)
    user: brian
    port: 22
    os: windows
    cpu: AMD Athlon II X2 B24 (2 cores / 2 threads)
    threads: 2
    ram_mib: 16379               # total; ~11490 MiB free at measurement
    reserve_ram_mib: 4096        # policy, not measured: Windows 10 + green-roomz
    notes: >-
      Windows 10 Home 10.0.19045 x64. Value is 16 GB RAM (bigger CPU models than
      miryam) but slow: ~3.0 tok/s CPU on 0.5B Q4 per green-roomz #4 (measured
      there, not by familia). nvidia driver 341.92 present; sm11 PTX shim on E:\temp\gpu-legacy (not on PATH).
      Drives: C: 4.6 GiB free, E: 35.4 GiB free (models go on E:).
    gpus:
      - vendor: nvidia
        model: GeForce 8600 GT
        vram_mib: 256
        backend: cuda-sm11-ptx   # hand-written PTX + CUDA driver API (nvcuda.dll)
        backend_status: verified
        compute_capability: "1.1"
        driver: 9.18.13.4192 (341.92, last Tesla-arch driver)
        measured: true
        notes: >-
          Verified 2026-10-10 PT via familia gpu-legacy (feat/qodesh-legacy-gpu).
          Fast path (full residency 57/57 MiB, OMP=2, unpinned): stories15M FP32
          full-forward 34.3 tok/s alone; concurrent with CPU SmolLM2-135M Q4_0
          33.3 tok/s GPU + 11.5 tok/s CPU (~3% contention). Prior 17 t/s was
          OMP=1+pinned + 4/57 MiB resident. Catalog (#24): K2-Horizon-0.9B Q4
          ~605 MiB too large; SmolLM2-135M Q4_0 87.4 MiB fits ~100 MiB budget
          GGUF via ggml-sm11 (2026-10-10): SmolLM2 Q4_0 4.5 tok/s GPU, 56 MiB
          resident (Q8_0 output stays CPU under 16 MiB VRAM margin); concurrent
          4.5 GPU + 10.6 CPU. Backend cuda-sm11-ptx only.
    windows:
      repo_path: TBD
      models_path: 'E:\temp\familia\models'   # start.bat default when E:\temp exists; else %USERPROFILE%\familia\models
      runtime_path: TBD                  # no llama-server installed yet; start.bat looks in <repo>\runtime
      # sm11-legacy runtime (shim + kernels.ptx) lives in E:\temp\gpu-legacy; see runtimes.
      startup: start.bat         # manual run; scheduled-task once opted in (green-roomz uses scripts/serve-window.cmd, #18)
      start_script: 'scripts\windows\start.bat'
      task_name: familia-llama-server    # used only after install-task.ps1 -Install
      autostart: false           # opt-in; flip with startup: scheduled-task after running install-task.ps1 -Install
      avx_required: false        # official win-cpu-x64 build ran on the non-AVX Athlon II X2 (2026-10-09)
      wake: tbd

runtimes:
  llama-b11669:
    kind: llama-server
    build: b11669
    # Official ggml-org release llama-b11669-bin-ubuntu-vulkan-x64.tar.gz
    # (release tag b11669, commit 620d2225cc436ab0b001e3200e590e3b286ef9ab)
    commit: 620d2225cc436ab0b001e3200e590e3b286ef9ab
    bin: code-bootstraps-llama.cpp/bin/llama-b11669-linux-x64-vulkan/llama-server
    hosts: [miryam]
    supported_archs: [llama, qwen35, gemma-embedding2]
    backends: [cpu, vulkan]
    spec_types: [draft-simple, ngram-simple, ngram-map-k, ngram-map-k4v, ngram-mod, ngram-cache]

  llama-b11374:
    kind: llama-server
    build: b11374
    commit: b92761a515ea31e852e7fbc1fad5f874b46f3718
    bin: code-bootstraps-llama.cpp/bin/llama-b11374-linux-x64-vulkan/llama-server
    hosts: [miryam]
    # Only archs verified to load on this build.
    supported_archs: [qwen35]
    backends: [cpu, vulkan]
    spec_types: [draft-simple, ngram-simple, ngram-map-k, ngram-map-k4v, ngram-mod, ngram-cache]

  llama-b11539:
    kind: llama-server
    build: b11539
    # Official ggml-org release llama-b11539-bin-ubuntu-vulkan-x64.tar.gz
    # (sha256 c94e4cf093d38054e4b3384491b0948a659474a207149e65a12b9e5993498182);
    # includes ggml-org/llama.cpp#30054 (gemma-embedding2).
    commit: 10a60cf30
    bin: code-bootstraps-llama.cpp/bin/llama-b11539-linux-x64-vulkan/llama-server
    hosts: [miryam]
    supported_archs: [gemma-embedding2]
    backends: [cpu, vulkan]
    spec_types: [draft-simple, ngram-simple, ngram-map-k, ngram-map-k4v, ngram-mod, ngram-cache]

  sm11-legacy-qodesh:
    kind: sm11-legacy
    build: "gpu-legacy run_sm11 + kernels.ptx (CUDA driver API, sm_11)"
    commit: 7dc2b734db35e6bbbe8da3dcef4fb12eb55f865a
    hosts: [qodesh]
    supported_archs: [llama2c]
    backends: [cpu, cuda-sm11-ptx]
    spec_types: []
    bin: gpu-legacy/out/run_sm11.exe

  termux-llama-cpp-0.6.0:
    kind: llama-server           # from the Termux package; pinned by package version (no upstream sha)
    build: Termux llama-cpp 0.5.0 + llama-cpp-backend-vulkan (pkg)
    commit: pkg:llama-cpp=0.6.0  # `llama-server --version`: 0.5.0 (build 0, commit unknown); pin is the pkg version
    bin: llama-server            # on PATH in Termux; familia-start sets LD_LIBRARY_PATH for system libvulkan
    hosts: [phone7, phone8]      # phone8 on 0.6.0; phone7 had 0.5.0 (match before comparing)
    supported_archs: [llama, qwen2]   # SmolLM2 + Qwen2.5-0.5B verified 2026-10-10
    backends: [cpu, vulkan]
    spec_types: []

  llama-b11541-linux-vulkan:
    kind: llama-server
    build: b11541 ubuntu-vulkan-x64 (prebuilt)
    commit: f2918cabb
    bin: ~/repositories/llama-vulkan-b11541/llama-b11541/llama-server
    hosts: [miryam]
    supported_archs: [llama, lfm2]
    backends: [cpu, vulkan]
    spec_types: []

  llama-b11540-win-cpu:
    kind: llama-server
    build: b11540 win-cpu-x64
    commit: 1e6f04a75
    hosts: [qodesh]
    supported_archs: [llama, qwen2, gemma2, gemma3, qwen35]  # qwen35 verified by llama-bench 2026-10-10
    backends: [cpu]
    spec_types: []
    bin: E:/temp/llama-cpu/llama-server.exe

  lbref:
    # familia LittleBit reference runtime (numpy, docs/littlebit.md). Correctness only:
    # kind: reference has no HTTP server, so validate_graph.py --args refuses it.
    kind: reference
    build: scripts/littlebit/lbref.py (familia, numpy)
    commit: lbref-v1
    bin: scripts/littlebit/lbref.py
    hosts: [miryam, qodesh]
    supported_archs: [llama]
    backends: [cpu]
    spec_types: []
    quants: [littlebit]          # the only runtime that may load .lbit.gguf files

nodes:
  coder:
    status: active
    model: qwen35-2b-q4km
    host: miryam
    runtime: llama-b11669
    ctx: 65536                   # total; per-slot = ctx / parallel
    override_reasons:            # model card / model-database deviations (#51)
      ctx: "miryam has 7270 MiB with a 3072 MiB reserve: at 262144 the q8_0 KV is ~1650 MiB and cache_ram must cover a slot's prompt state (~1650 MiB), about 2.4 GiB more than at 65536 (426 MiB K[..."
    parallel: 1
    kv_type: q8_0
    flash_attn: true
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}   # iGPU measured worse + needs extra RAM (LESSONS L-miryam-perf)
    threads: 3                   # -t 3 beat -t 2 in two 3-rep runs (2026-10-19: tg 6.58 vs 6.14 mean under desktop load; 7.22 vs 6.77); -t 4 is worse (6.3 vs 8.4, 2026-10-10)
    slot_save: true              # hermes' fixed prompt prefix is prefilled once, then restored from disk (#85)
    load_mode: none              # -lm none: real launch peak RSS 1790-1863 vs 2353 MiB with mmap, load 23-35 vs 25-41 s, tg 8.55-8.66 vs 8.84-8.86 (2026-10-19, x2)
    bind: 127.0.0.1
    port: 9941
    cache_ram_mib: 1024          # >= per-slot prompt state (validator checks)

  embed:
    status: active
    model: egemma2-q8
    host: miryam
    runtime: llama-b11669        # b11374 fails: unknown model architecture 'gemma-embedding2'
    ctx: 8192
    parallel: 1
    kv_type: f16
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9951
    embeddings: true
    cache_ram_mib: 0             # embedding servers keep no prompt cache
