    local_names: [green-Macmini7-1, macmini]
    gpus: null                   # Haswell-ULT HD5000 (/dev/dri present); measure Vulkan before -ngl>0
    notes: >-
      Ubuntu ZFS box: rpool ~920G root, spool ~98G mounted at /SSD (79G free 2026-10-27).
      Repo at /SSD/Shared/green/familia (symlink ~/familia). Spill dirs:
