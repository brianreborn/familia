harnesses:
  # Target harness descriptors (docs/harness2.md). Files only: prompt, guardrails, memory,
  # skills. There is no field for tools or toolsets, so nothing here can widen them.
  hermes-lab:
    # plugins: [rea]   # #92: symlink from ~/.hermes/plugins into rendered HERMES_HOME
    kind: files
    agent: hermes-lab
    root: ~/.cache/familia/hermes-hermes-lab   # the HERMES_HOME scripts/hermes.sh renders for it
    prompt: SOUL.md                            # guardrails + memory become sections of SOUL.md
    skills: skills
    node: coder                                # editing + evaluation endpoint (loopback)
  hermes:
    kind: files
    agent: hermes
    root: ~/.cache/familia/hermes-hermes
    prompt: SOUL.md
    skills: skills
    node: coder

self_improve:
  # Harness² (google-research/harness2), opt-in; off = nothing runs and nothing is synced.
  harness2:
    experimental: true
    engine: harness2
    mode: propose                # "off" (quoted: YAML reads bare off as false) | propose (review by hand) | apply (needs consent)
    targets: [hermes-lab]
    k: 1
    recursion: parallel          # parallel = Harness² agg, sequential = seq
    tasks: coding-v1             # registry/harness2-tasks/coding-v1.json
    max_tasks: 3
  harness2-hermes:
    experimental: true
    engine: harness2
    mode: propose
    targets: [hermes]
    k: 1
    recursion: parallel
    tasks: coding-v1
    max_tasks: 3
