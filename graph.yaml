# Declarative model/agent graph, typed schema v2 (see docs/graph-types.md, #19).
# Nothing is auto-selected and nothing has defaults: every field is explicit,
# and scripts/validate_graph.py fails loudly if the graph does not fit the
# measured hardware, the runtime's supported architectures, or the agents.
# Rule: a value we did not measure ourselves is never written as measured.
# Reported numbers go under `reported:` with a source; GPU vram_mib stays null
# until `measured: true`.
# Standing rule (2026-10-09 OOM): never aim for high RAM on small hosts — see docs/ram-safety.md.
# Privacy (#104): hosts.*.addr/user and meshes.*.bind are placeholders in the
# tracked file. Real connection details live in the untracked hosts overlay
# (~/.config/familia/hosts.local.yaml or repo-root hosts.local.yaml). See
# docs/hosts-overlay.md. History scrub of past commits is optional/out-of-scope.
version: 2

hosts:
  miryam:
    kind: laptop
    measured: true
    # Connection details live in hosts.local.yaml overlay (#104); never commit real addr/user.
    addr: REPLACE_ME
    user: REPLACE_ME
    port: 22
    os: linux
    cpu: Intel Core i5-7200U
    threads: 4
    ram_mib: 7270                # 7.1 GiB MemTotal
    # Standing rule (2026-10-09 OOM hard-hang): never aim for high RAM.
    # Keep ~2+ GiB free after estimated node use on hosts under 8 GiB. See docs/ram-safety.md.
    reserve_ram_mib: 3072        # OS + hermes-agent + browser + 3 GiB safety margin (was 2048)
    gpus:
      - vendor: intel
        model: Intel HD Graphics 620 (KBL GT2, integrated)
        vram_mib: 0              # shared-memory iGPU; Vulkan reports 5467 MiB shared
        backend: vulkan
        backend_status: verified # 2026-10-10 02:47 PT, SmolLM2-135M Q4_0 -ngl 99, identical output to CPU at temp 0
        driver: Mesa 26.0.8 Intel Vulkan
        compute_capability: null
        measured: true
        notes: >-
          SmolLM2-135M Q4_0: CPU -t2 pp64 430.4 / tg32 101.4 t/s; Vulkan -ngl 99 pp64 320.0 / tg32 46.2 t/s
          (the iGPU is slower than the CPU for this model). Concurrency 2026-10-10 08:40 PT with
          llama-b11541: CPU stand-in coder LFM2.5-1.2B Q4_K_M -t3 alone pp128 43.5 / tg64 13.9, Vulkan SmolLM2 Q4_0
          -t1 alone pp128 325.8 / tg64 45.8; together CPU pp128 26.9 / tg64 14.7, Vulkan pp128 134.4 / tg64 16.9;
          min MemAvailable 3160 MiB. Real coder (Qwen3.5-2B, 64k ctx) not run: would leave under 3 GiB free.
  qodesh:
    kind: desktop
    measured: true               # measured 2026-10-09 20:36 PT
    # Connection details live in hosts.local.yaml overlay (#104); OpenSSH client only on this host.
    addr: REPLACE_ME
    user: REPLACE_ME
    port: 22
    os: windows
    cpu: AMD Athlon II X2 B24 (2 cores / 2 threads)
    threads: 2
    ram_mib: 16379               # total; ~11490 MiB free at measurement
    reserve_ram_mib: 4096        # policy, not measured: Windows 10 + green-roomz
    notes: >-
      Windows 10 Home 10.0.19045 x64. Value is 16 GB RAM (bigger CPU models than
      miryam) but slow: ~3.0 tok/s CPU on 0.5B Q4 per green-roomz #4 (measured
      there, not by familia). nvidia driver 341.92 present; sm11 PTX shim on E:\temp\gpu-legacy (not on PATH).
      Drives: C: 4.6 GiB free, E: 35.4 GiB free (models go on E:).
    gpus:
      - vendor: nvidia
        model: GeForce 8600 GT
        vram_mib: 256
        backend: cuda-sm11-ptx   # hand-written PTX + CUDA driver API (nvcuda.dll)
        backend_status: verified
        compute_capability: "1.1"
        driver: 9.18.13.4192 (341.92, last Tesla-arch driver)
        measured: true
        notes: >-
          Verified 2026-10-10 PT via familia gpu-legacy (feat/qodesh-legacy-gpu).
          Fast path (full residency 57/57 MiB, OMP=2, unpinned): stories15M FP32
          full-forward 34.3 tok/s alone; concurrent with CPU SmolLM2-135M Q4_0
          33.3 tok/s GPU + 11.5 tok/s CPU (~3% contention). Prior 17 t/s was
          OMP=1+pinned + 4/57 MiB resident. Catalog (#24): K2-Horizon-0.9B Q4
          ~605 MiB too large; SmolLM2-135M Q4_0 87.4 MiB fits ~100 MiB budget
          GGUF via ggml-sm11 (2026-10-10): SmolLM2 Q4_0 4.5 tok/s GPU, 56 MiB
          resident (Q8_0 output stays CPU under 16 MiB VRAM margin); concurrent
          4.5 GPU + 10.6 CPU. Backend cuda-sm11-ptx only.
    windows:
      repo_path: TBD
      models_path: 'E:\temp\familia\models'   # start.bat default when E:\temp exists; else %USERPROFILE%\familia\models
      runtime_path: TBD                  # no llama-server installed yet; start.bat looks in <repo>\runtime
      # sm11-legacy runtime (shim + kernels.ptx) lives in E:\temp\gpu-legacy; see runtimes.
      startup: start.bat         # manual run; scheduled-task once opted in (green-roomz uses scripts/serve-window.cmd, #18)
      start_script: 'scripts\windows\start.bat'
      task_name: familia-llama-server    # used only after install-task.ps1 -Install
      autostart: false           # opt-in; flip with startup: scheduled-task after running install-task.ps1 -Install
      avx_required: false        # official win-cpu-x64 build ran on the non-AVX Athlon II X2 (2026-10-09)
      wake: tbd
  shalom:
    kind: unknown
    measured: false
    gpus: null                   # inventory unknown; nothing recorded
  godslove:
    kind: laptop
    measured: false              # reported, not measured: excluded from placement
    os: freebsd-15
    cpu: Intel Core i7-620M
    reported:
      source: brianreborn/green-roomz#5
