    status: active
    model: qwen35-2b-q4km
    host: miryam
    runtime: llama-b11374
    ctx: 65536                   # total; per-slot = ctx / parallel
    parallel: 1
    kv_type: q8_0
    flash_attn: true
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9941
    cache_ram_mib: 1024          # >= per-slot prompt state (validator checks)
  embed:
    status: active
    model: egemma2-q8
    host: miryam
    runtime: llama-b11539        # b11374 fails: unknown model architecture 'gemma-embedding2'
    ctx: 8192
    parallel: 1
    kv_type: f16
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9951
    embeddings: true
    cache_ram_mib: 0             # embedding servers keep no prompt cache
  qodesh-resident:
    # Pencilled in: green-roomz's resident 0.5B chat path on qodesh (#18).
