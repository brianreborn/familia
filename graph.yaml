    gpus:
      - vendor: samsung
        model: Samsung Xclipse 550   # vulkaninfo deviceName, INTEGRATED_GPU
        vram_mib: 0              # shared-memory iGPU; Vulkan heap0 6.83 GiB device-local (shared), heap1 64 MiB
        backend: vulkan          # Vulkan 1.4.304, conformance 1.4.1.1; fp16, int8, 16-bit storage; subgroup 64
