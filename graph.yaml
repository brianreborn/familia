  macmini:
    kind: desktop
    measured: true
    # Address/login live only in ~/.config/familia/monitor.json and ~/.ssh/config (ProxyJump angel).
    # Hardware profile: registry/hosts.yaml -> intel-haswell-i5-4308u-hd5000-linux.
