# Declarative model/agent graph (see #19). Nothing is auto-selected:
# every node, file, ctx, KV type and slot count is explicit, and
# scripts/validate_graph.py fails loudly if the graph does not fit the
# measured hardware or the agents' requirements.
version: 1
host:
  # Baseline measured on miryam: i5-7200U (4 threads), 7.1 GiB RAM, Intel HD 620 (no VRAM).
  reserve_ram_mib: 2048          # left for OS, hermes-agent, browser
nodes:
  coder:
    model: ~/.local/share/gguf/models/coder/Qwen3.5-2B-Q4_K_M.gguf
    arch: qwen35                  # must match GGUF general.architecture
    ctx: 65536                    # total; per-slot = ctx / parallel
    parallel: 1
    kv_type: q8_0
    flash_attn: true
    gpu_layers: 0
    host: 127.0.0.1
    port: 9941
    aliases: [coder]
    cache_ram_mib: 1024           # >= per-slot prompt state (validator checks)
agents:
  hermes:
    min_ctx: 64000                # hermes-agent MINIMUM_CONTEXT_LENGTH
    context_length: 65536         # hermes model.context_length; must equal node per-slot ctx
    edges:
      model: coder                # model.default / base_url
hosts:
  # Transport endpoints (familia #5, #22). Phones: Termux sshd on :8022, key-only.
  miryam: {addr: 192.168.1.9, user: rcs, port: 22, kind: desktop}   # addr measured on miryam (wlp2s0)
  qodesh: {addr: 192.168.1.2, user: brian, port: 22, kind: desktop}   # Windows 10; OpenSSH client only (no sshd, no rsync)
  phone7: {addr: 192.168.1.7, user: u0_a439, port: 8022, kind: phone}
  phone8: {addr: 192.168.1.8, user: u0_a414, port: 8022, kind: phone}
transports:
  lan-nexus:
    type: ssh                     # scripts/nexus/nexus.py
    hub: miryam
    root: ~/.familia/nexus        # peers/ + artifacts/<sha256>/ on the hub
    identity: ~/.ssh/id_ed25519
    host_key_policy: accept-new
    members: [miryam, qodesh, phone7, phone8]
  lan-bt:
    type: bittorrent              # scripts/bt/; keys are magnet:<xt>:<path> (REQ-REPO-02)
    tracker: miryam
    bind: 192.168.1.9             # LAN only; must match hosts.miryam.addr
    port: 6969
    private: true
    client: aria2c
    members: [miryam, phone7, phone8]
