    role: pentest
    unverified: true
    sources: ["BrianReborn_alt RT 2026-09-20"]
    size_note: ~3.2 GB Q2_K (from post)
    placement_note: Launch-test only (see pentests). qodesh by RAM.
    candidate_hosts: [qodesh]
  # ---- #24 decision models; gpu_candidate = considered for the always-on 8600 GT role (256 MB)
