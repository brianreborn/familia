# Declarative model/agent graph, typed schema v2 (see docs/graph-types.md, #19).
# Nothing is auto-selected and nothing has defaults: every field is explicit,
# and scripts/validate_graph.py fails loudly if the graph does not fit the
# measured hardware, the runtime's supported architectures, or the agents.
# Rule: a value we did not measure ourselves is never written as measured.
# Reported numbers go under `reported:` with a source; GPU vram_mib stays null
# until `measured: true`.
# Standing rule (2026-10-09 OOM): never aim for high RAM on small hosts — see docs/ram-safety.md.
version: 2

hosts:
  miryam:
    kind: laptop
    measured: true
    os: linux
    cpu: Intel Core i5-7200U
    threads: 4
    ram_mib: 7270                # 7.1 GiB MemTotal
    # Standing rule (2026-10-09 OOM hard-hang): never aim for high RAM.
    # Keep ~2+ GiB free after estimated node use on hosts under 8 GiB. See docs/ram-safety.md.
    reserve_ram_mib: 3072        # OS + hermes-agent + browser + 3 GiB safety margin (was 2048)
    gpus:
      - vendor: intel
        model: Intel HD Graphics 620 (integrated, shares system RAM)
        vram_mib: null           # no dedicated VRAM; usable shared budget unmeasured
        backend: vulkan          # vulkan or sycl possible; neither measured for offload
        backend_status: tbd
        driver: null
        compute_capability: null
        measured: false
  qodesh:
    kind: desktop
    measured: true               # measured 2026-10-09 20:36 PT
    os: windows
    cpu: AMD Athlon II X2 B24 (2 cores / 2 threads)
    threads: 2
    ram_mib: 16379               # total; ~11490 MiB free at measurement
    reserve_ram_mib: 4096        # policy, not measured: Windows 10 + green-roomz
    notes: >-
      Windows 10 Home 10.0.19045 x64. Value is 16 GB RAM (bigger CPU models than
      miryam) but slow: ~3.0 tok/s CPU on 0.5B Q4 per green-roomz #4 (measured
      there, not by familia). No nvidia-smi or llama-server on PATH yet.
      Drives: C: 4.6 GiB free, E: 35.4 GiB free (models go on E:).
    gpus:
      - vendor: nvidia
        model: GeForce 8600 GT
        vram_mib: 256
        backend: none            # unusable for llama.cpp inference
        backend_status: unsupported
        compute_capability: "1.1"
        driver: 9.18.13.4192 (341.92, last Tesla-arch driver)
        measured: true
        notes: >-
          No Vulkan driver (#4). Current llama.cpp CUDA needs far newer compute
          capability; CUDA 6.5 / sm_1.1 only serves green-roomz sm11-monitor
          kernels (Win32 build, #13/#16). #14 partial 0.5B offload stays an
          optional experiment, not something the graph may place.
    windows:
      repo_path: TBD
      models_path: 'E:\familia\models'   # proposed: E: has the free space; not created yet
      runtime_path: TBD                  # no llama-server installed yet
      startup: tbd               # scheduled-task | start.bat | service | manual; green-roomz uses scripts/serve-window.cmd (#18)
      wake: tbd
  shalom:
    kind: unknown
    measured: false
    gpus: []                     # unknown; nothing recorded
  godslove:
    kind: laptop
    measured: false              # reported, not measured: excluded from placement
    os: freebsd-15
    cpu: Intel Core i7-620M
    reported:
      source: brianreborn/green-roomz#5
      ram_mib: 8192
    gpus:
      - vendor: intel
        model: Ironlake HD / NVS (per green-roomz #5; exact model unknown)
        vram_mib: null
        backend: none            # #5: "No Vulkan/CUDA - CPU"
        backend_status: unsupported
        compute_capability: null
        driver: null
        measured: false
  note9:
    kind: phone
    measured: false
    os: android
    cpu: Snapdragon 845 (SDM845)
    notes: Samsung Galaxy Note 9. Which of 192.168.1.7 (u0_a439) / .8 (u0_a414) is which is unconfirmed; key not installed yet.
    gpus:
      - vendor: qualcomm
        model: Adreno 630
        vram_mib: null           # shared memory
        backend: opencl          # vulkan or opencl possible; unmeasured
        backend_status: tbd
        compute_capability: null
        driver: null
        measured: false
  a57:
    kind: phone
    measured: false
    os: android
    cpu: Samsung Galaxy A57 SM-A576U (SoC unconfirmed)
    reported:
      source: familia docs
      ram_mib: 7430
    gpus: []                     # GPU not recorded yet
  pixel8:
    kind: phone
    measured: false
    os: android
    cpu: Google Tensor G3
    gpus:
      - vendor: arm
        model: Mali (Immortalis-G715 class, unconfirmed)
        vram_mib: null
        backend: vulkan          # vulkan or opencl; unmeasured
        backend_status: tbd
        compute_capability: null
        driver: null
        measured: false

transports:
  miryam-local: {kind: local, from: miryam, to: miryam}

runtimes:
  llama-b11374:
    kind: llama-server
    build: b11374
    commit: b92761a515ea31e852e7fbc1fad5f874b46f3718
    bin: code-bootstraps-llama.cpp/bin/llama-b11374-linux-x64-vulkan/llama-server
    hosts: [miryam]
    # Only archs verified to load on this build.
    supported_archs: [qwen35]
    backends: [cpu, vulkan]      # vulkan build; cpu always available
    # --spec-type values accepted by this build's --help (verified on box CPU build b11374).
    spec_types: [draft-simple, ngram-simple, ngram-map-k, ngram-map-k4v, ngram-mod, ngram-cache]
  llama-b11539:
    kind: llama-server
    build: b11539
    # Official ggml-org release llama-b11539-bin-ubuntu-vulkan-x64.tar.gz
    # (sha256 c94e4cf093d38054e4b3384491b0948a659474a207149e65a12b9e5993498182);
    # includes ggml-org/llama.cpp#30054 (gemma-embedding2).
    commit: 10a60cf30
    bin: code-bootstraps-llama.cpp/bin/llama-b11539-linux-x64-vulkan/llama-server
    hosts: [miryam]
    supported_archs: [gemma-embedding2]
    backends: [cpu, vulkan]
    spec_types: [draft-simple, ngram-simple, ngram-map-k, ngram-map-k4v, ngram-mod, ngram-cache]

models:
  qwen35-2b-q4km:
    gguf: ~/.local/share/gguf/models/coder/Qwen3.5-2B-Q4_K_M.gguf
    sha256: unmeasured           # fill in from `sha256sum` on miryam
    arch: qwen35                 # must match GGUF general.architecture
    trained_ctx: 262144          # must match GGUF qwen35.context_length (checked)
    role: coder
  egemma2-q8:
    gguf: ~/.local/share/gguf/models/embed/embeddinggemma-2-Q8_0.gguf
    sha256: unmeasured
    arch: gemma-embedding2       # unknown to b11374
    trained_ctx: 262144          # GGUF gemma-embedding2.context_length
    role: embed

nodes:
  coder:
    status: active
    model: qwen35-2b-q4km
    host: miryam
    runtime: llama-b11374
    ctx: 65536                   # total; per-slot = ctx / parallel
    parallel: 1
    kv_type: q8_0
    flash_attn: true
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9941
    cache_ram_mib: 1024          # >= per-slot prompt state (validator checks)
  embed:
    status: active
    model: egemma2-q8
    host: miryam
    runtime: llama-b11539        # b11374 fails: unknown model architecture 'gemma-embedding2'
    ctx: 8192
    parallel: 1
    kv_type: f16
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9951
    embeddings: true
    cache_ram_mib: 0             # embedding servers keep no prompt cache
  qodesh-resident:
    # Pencilled in: green-roomz's resident 0.5B chat path on qodesh (#18).
    # Planned nodes are schema-checked only; no placement, file or RAM checks.
    status: planned
    model: qwen35-2b-q4km        # placeholder until a 0.5B model entry exists
    host: qodesh
    runtime: llama-b11374        # placeholder: a Windows CPU build must be declared first
    ctx: 4096
    parallel: 1
    kv_type: q8_0
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9941
    cache_ram_mib: 0

speculative:
  # Pencilled in. Draft is loaded inside the target's llama-server (-md).
  coder-ngram:
    experimental: true
    status: planned
    mode: ngram
    target: coder
    spec_type: ngram-mod         # model-free lookup decoding; no extra weights, small RAM cost

gateways:
  roomz:
    kind: green-roomz
    host: miryam
    port: 9931

aliases:
  coder: {node: coder, gateway: roomz}
  embed: {node: embed, gateway: roomz}

agents:
  hermes:
    kind: hermes-agent
    host: miryam
    min_ctx: 64000               # hermes-agent MINIMUM_CONTEXT_LENGTH
    context_length: 65536        # must equal main alias per-slot ctx
    aliases:
      main: coder
      auxiliary: coder           # compaction model; explicit, not inferred

fleets:
  green-agentz:
    repo: brianreborn/green-agentz
    agents: [hermes]

agencies:
  familia-issues:
    repo: brianreborn/familia
    labels: [bug, config-graph]
    assignments:
      config-graph: hermes

pentests:
  # Pencilled in. Authorized testing of the owner's fleet only — not attack tooling.
  # Automation is launch-test only (validate → start → healthcheck → stop). Never live
  # scans, exploits, or network probes in tests. See docs/pentest-models.md and #15.
  # Model options from survey (unplaced): see options.dolphin3-cyber-8b.
  android-fleet:
    name: Android fleet authorized testing
    node: coder                   # placeholder until a role:pentest model is placed
    agent: hermes
    scope:
      allow: []                   # empty = nothing allowed; required non-empty to go active
      deny: []
    tools:
      allow: []                   # explicit tool names only; no wildcards
    report_to: familia-issues
    requires_operator_confirm: true
    launch_test_only: true
    status: planned
    notes: >-
      Ties to android_start.sh --role pentest and missing scripts/pentest-role.json (#15).
      Activate only after a pentest-role model is placed, scope.allow lists owned hosts/CIDRs,
      and tools.allow is an explicit allowlist. Operator confirm required.

options:
  # Unplaced model options (catalog only). Placement ignores this section; promote an
  # option by adding a real models: entry with a measured sha256. Everything below is
  # UNVERIFIED: names and claims come from reposts as summarized in #20.
  dolphin3-cyber-8b:
    role: pentest
    unverified: true
    sources: ["BrianReborn_alt RT 2026-09-20"]
    size_note: ~3.2 GB Q2_K (from post)
    placement_note: Launch-test only (see pentests). qodesh by RAM.
    candidate_hosts: [qodesh]
  # ---- #24 decision models; gpu_candidate = considered for the always-on 8600 GT role (256 MB)
  k2-type-0.9b:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106354389611094041"]
    size_note: 0.9B params; ~0.5 GB at Q4 (estimate, not measured) - needs <=~200 MB slice or heavy quant for 256 MB VRAM
    gpu_candidate: true
    gpu_host: qodesh
    placement_note: Best fit for 8600 GT always-on role per #20; partial offload (some layers on GPU) likely.
    candidate_hosts: [qodesh, miryam]
  drex-1.5:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2108691502864163123"]
    hf_repo: nace-ai/drex-v1.5
    size_note: "HF API 2026-10-09: Qwen3_5ForCausalLM, 8.95B params (bf16 ~17.9 GB); nace-ai/drex-v1.5-Q8_0 9.53 GB; mradermacher/drex-v1.5-GGUF Q4_K_M 5.63 GB, Q4_K_S 5.35 GB, Q2_K 3.83 GB"
    gpu_candidate: false
    placement_note: "Not a 256 MB GPU fit (9B). CPU only: Q4_K_M fits qodesh's ~9.6 GiB budget (<=60% of 16 GiB, 4 GiB reserve); does not fit miryam (4.1 GiB budget minus the coder). 128k ctx claimed."
  drex-1.1:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2107800181316141401"]
    size_note: unknown
    gpu_candidate: true
    gpu_host: qodesh
    runtime_note: Diffusion LM; llama.cpp-compatible per post (drex-dlm runtime kind exists, unpinned).
    notes: "Possibly nace-ai/drex-dlm (EfficientDLM, 8.19B params, cc-by-nc-4.0) - link to Drex 1.1 not confirmed. At 8B it is not a 256 MB GPU fit either."
  glide:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2107815038589567062"]
    size_note: unknown
    gpu_candidate: true
    gpu_host: qodesh
    notes: Decision Index winner per post.
  cloudflare-clef:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106238504938377271"]
    size_note: unknown
    gpu_candidate: true
    gpu_host: qodesh
    notes: On HF per post; repo id not resolved.
  gev-26b-decide:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2107731560246215067", "https://x.com/BrianReborn_alt/status/2106259773931024477"]
    size_note: 26B params - far too big for 256 MB VRAM; ~15 GB at Q4 (estimate) exceeds every host's free RAM
    gpu_candidate: false
    placement_note: Catalog only.
  # ---- #25 on-device speech
  whistle-stt:
    role: stt
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2108691766589415772", "https://x.com/BrianReborn_alt/status/2106699237761392838"]
    hf_repo: Cactus-Compute/whistle
    size_note: "whistle.cact 16.9 MB (HF API); checkpoints/whistle.safetensors 220.6 MB; apache-2.0"
    runtime_note: Cactus runtime (.cact, library cactus-needle); not llama-server. Needs an stt node kind before placement.
    placement_note: Phones and qodesh first (#25).
    candidate_hosts: [note9, pixel8, a57, qodesh]
  paradee-tts:
    role: tts
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2108070180769407307"]
    hf_repo: sahilmahendrakar/Paradee-8M-v1.0
    size_note: "8M params; onnx/paradee_int8.onnx 9.0 MB, paradee.onnx 37.0 MB (HF API); apache-2.0. Repo is the most likely match for the RT, not confirmed from the post."
    runtime_note: ONNX Runtime (CoreML port FluidInference/paradee-8m-coreml); not llama-server. Needs a tts node kind before placement.
    placement_note: Phones and qodesh first (#25).
    candidate_hosts: [note9, pixel8, a57, qodesh]
  # ---- #26 coder candidate
  qwen35-9b-coder:
    role: coder
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2108600815808336061"]
    size_note: 9B params; ~5.5 GB at Q4_K_M + KV (estimate, not measured)
    placement_note: qodesh only by RAM (16 GB, ~11.5 GB free). miryam (7 GB, 3 GB reserve) cannot fit it.
    candidate_hosts: [qodesh]
    notes: Kimi-k3 distill claim from post; HF repo, quants and license unresolved.
  # ---- docs/models-catalog.md additions (RT'd, bucket 2; all unverified)
  youtu-parsing-omni:
    role: vision
    unverified: true
    hf_repo: tencent/Youtu-Parsing-Omni
    sources: ["https://x.com/BrianReborn_alt/status/2108756031493025930"]
    size_note: "~5B params, bf16 safetensors ~10.7 GB (rev 01f7e3e, per feat/youtu-parsing-omni-option)"
    runtime_note: "youtu_vita custom code; transformers trust_remote_code or vLLM + Tencent plugin. No llama.cpp/GGUF support."
    placement_note: "bf16 exceeds qodesh's ~9.6 GiB budget and miryam's. Needs a non-llama runtime and a quantized build."
  voice-clone-1.7b:
    role: tts
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2108533834400850249"]
    size_note: "1.7B params (from post); file size unknown"
    runtime_note: Model name, repo and runtime not given in the RT text.
  tencent-translate-440mb:
    role: chat
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2105728713950437842"]
    size_note: "~440 MB, 33 languages (from post)"
    notes: On-device translation. Repo id not resolved.
  index-translate:
    role: chat
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2105389175872847935"]
    size_note: unknown (Qwen3.5-based family per post)
    notes: Bilibili Index-Translate MT family. Repo id not resolved.
  decision-2.0:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106237127449362760"]
    size_note: "0.6B-27B family (from post); only the 0.6B could approach the 256 MB GPU slice, and only heavily quantized"
    gpu_candidate: true
    gpu_host: qodesh
  kev-1.0:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106235881904599179"]
    size_note: unknown
    notes: Kev 1.0 decision model family. Repo id not resolved.
  jev-cpu-decision:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106949194913366275"]
    size_note: unknown
    notes: Jev-style decision model that runs on CPU (per post).
  jp-decision-gguf:
    role: decision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106236190940950767"]
    size_note: unknown
    notes: Japanese decision/chat GGUF plus training data.
  qwen35-0.8b-jp:
    role: chat
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106236078533550141"]
    size_note: "0.8B params (from post); file size unknown"
    notes: Japanese fine-tune; tiny local option. Arch qwen35 is in the pinned llama.cpp build (qwen35-2b-q4km runs today).
  lift-extract:
    role: vision
    unverified: true
    sources: ["https://x.com/BrianReborn_alt/status/2106703750262141361"]
    size_note: unknown
    notes: lift JSON/document extraction model; parsing option beside Youtu.
