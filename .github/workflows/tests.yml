name: tests
# Runs familia's own pytest suite (pytest.ini testpaths=tests; proving grounds excluded).
# lint-warnings.yml only collects; this job executes the tests (#218).
# Pins are not synced here (scripts/run-tests.sh does that for local runs), so tests that
# need a pin checkout, model binaries or pwsh/man/groff skip themselves (#234, #235).
on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: python test deps
        run: python -m pip install --quiet pytest pyyaml
      - name: pytest
        env:
          LC_ALL: C.UTF-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider -rfE tests
