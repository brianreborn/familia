name: tests
# Runs familia's own pytest suite (pytest.ini testpaths=tests; proving grounds excluded).
# lint-warnings.yml only collects; this job executes the tests (#218).
# Pins are not synced here (scripts/run-tests.sh does that for local runs), so tests that
# need a pin checkout, model binaries or pwsh/man/groff skip themselves (#234, #235).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pin-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Fetch this source anonymously
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -eu
          case "$REPOSITORY" in
            *[!A-Za-z0-9_./-]*|*/*/*|/*|*/) echo "invalid repository name" >&2; exit 2 ;;
          esac
          case "$SOURCE_REF" in
            refs/*) ;;
            *) echo "invalid source ref" >&2; exit 2 ;;
          esac
          git init --quiet .
          git -c credential.helper= fetch --quiet --no-tags --depth=1 \
            "https://github.com/${REPOSITORY}.git" "$SOURCE_REF"
          git checkout --quiet --detach FETCH_HEAD
      - name: Verify every pinned revision
        run: python3 scripts/check_pins.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: python test deps
        run: python -m pip install --quiet pytest pyyaml pexpect
      - name: pytest
        env:
          LC_ALL: C.UTF-8
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider -rfE tests
