name: lint-warnings
# Fails on NEW warnings: shellcheck -x -S warning on all *.sh / *.mk, Python compile and
# pytest-collection warnings as errors. Pre-existing ones: .ci/warnings-baseline.txt.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: shellcheck 0.11.0 (pinned, sha256-checked)
        run: |
          set -eu
          v=0.11.0; f=shellcheck-v$v.linux.x86_64.tar.xz
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/v$v/$f"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "SHELLCHECK=$RUNNER_TEMP/shellcheck-v$v/shellcheck" >> "$GITHUB_ENV"
      - name: python deps for test collection
        run: python -m pip install --quiet pytest pyyaml
      - name: lint (fails on new warnings)
        run: sh .ci/lint-warnings.sh
