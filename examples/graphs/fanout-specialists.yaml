# Example graph: Router fan-out: one gateway, one alias per specialist (chat, coder, embeddings).
# Clients pick the specialist by alias name (model field); there is no automatic classifier yet
# (multi-node aliases are SPEC CFG-SPEC-ALIAS-001, docs/config/routing-spec.md).
# Placeholder hosts/paths; copy, then replace gguf paths and the runtime pin with your own.
# Validate: python3 scripts/validate_graph.py examples/graphs/fanout-specialists.yaml --no-files
version: 2
hosts:
  h1:
    kind: desktop
    measured: true
    os: linux
    cpu: x
    threads: 4
    ram_mib: 16000
    reserve_ram_mib: 2000
    gpus: []
runtimes:
  rt:
    kind: llama-server
    build: b1
    commit: abcdef1
    hosts: [h1]
    supported_archs: [llama, gemma-embedding2]
    backends: [cpu]
    spec_types: []
models:
  mchat: {gguf: /m/chat.gguf, sha256: bcc3af2849ad6095af57e9b5cd43775256efdc66e306acb529172f92d0c04b03, arch: llama,
    trained_ctx: 8192, role: chat, db: bartowski--SmolLM2-135M-Instruct-GGUF--SmolLM2-135M-Instruct-Q4_0}
  mcode: {gguf: /m/coder.gguf, sha256: bcc3af2849ad6095af57e9b5cd43775256efdc66e306acb529172f92d0c04b03, arch: llama,
    trained_ctx: 8192, role: coder, db: bartowski--SmolLM2-135M-Instruct-GGUF--SmolLM2-135M-Instruct-Q4_0}
  memb: {gguf: /m/e.gguf, sha256: 6f1bd4ac6c5df7444f9cca7ca36cafe6cfa34cd6f49fefb1e0b4be8143aed8bc, arch: gemma-embedding2,
    trained_ctx: 262144, role: embed, db: unsloth--embeddinggemma-2-GGUF--embeddinggemma-2-Q8_0}
nodes:
  chat:
    model: mchat
    host: h1
    runtime: rt
    ctx: 8192
    parallel: 1
    kv_type: f16
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9001
    cache_ram_mib: 0
    status: active
  coder:
    model: mcode
    host: h1
    runtime: rt
    ctx: 8192
    parallel: 1
    kv_type: f16
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9002
    cache_ram_mib: 0
    status: active
  emb:
    model: memb
    host: h1
    runtime: rt
    ctx: 8192
    parallel: 1
    kv_type: f16
    flash_attn: false
    offload: {backend: cpu, ngl: 0, split: none, main_gpu: 0}
    bind: 127.0.0.1
    port: 9003
    cache_ram_mib: 0
    status: active
    embeddings: true
gateways:
  gw: {kind: green-roomz, host: h1, port: 8080}
aliases:
  chat: {node: chat, gateway: gw}
  coder: {node: coder, gateway: gw}
  emb: {node: emb, gateway: gw}
agents:
  ag:
    kind: hermes-agent
    host: h1
    min_ctx: 1024
    context_length: 8192
    aliases: {main: chat, auxiliary: emb}
