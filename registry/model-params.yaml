# registry/model-params.yaml: judgement calls on model parameters that cannot be derived (#51).
# scripts/model_params.py derives most REQUIRED / RECOMMENDED parameters from the model cards,
# configs and GGUF headers; this file adds what needs a decision. Every item quotes the line it
# rests on ("source: owner/repo FILE:Lx[-y]" + "quote"); the check fails when the quote is not
# in those lines of the stored snapshot, so nothing here can drift from upstream silently.
# Keys per entry id (registry/models/<id>.json):
#   template:  {use: repo|gguf, sha256: <the repo template it was decided for>, reason, verified}
#   requires:  [{class, flag, value, source, quote, why, client}]   flag "@..." = not a llama-server flag
#              value "${ctx}" / "${slot_ctx}" is resolved per launch; ">=N" is a minimum, checked not emitted
#   blockers:  [{what, source, quote}]
#   base_model / role / not_roles / kind / license / github: [{repo, paths}] / native_ctx

LiquidAI--LFM2.5-1.2B-Instruct-GGUF--LFM2.5-1.2B-Instruct-Q4_K_M:
