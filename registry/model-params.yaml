nace-ai--drex-dlm-Q8_0--drex-dlm-Q8_0:
  kind: decision
  role: decision
  not_roles: [general]
  github:
    - repo: nace-ai/drex-decision-models
      paths: [models/drex-dlm/README.md]
  requires:
    - class: REQUIRED
      flag: "@runtime"
      value: "nace-ai/llama.cpp branch edlm (llama-server with the edlm architecture and POST /v1/systemone)"
      source: "nace-ai/drex-dlm-Q8_0 README.md:L12"
      quote: "a stock llama.cpp or Ollama installation is not a supported runner"
      why: "the edlm architecture exists only in the fork; stock builds cannot load the GGUF"
    - class: REQUIRED
      flag: "@endpoint"
      value: "POST /v1/systemone"
      source: "nace-ai/drex-dlm-Q8_0 README.md:L12"
      quote: "The model uses the custom `edlm` architecture and `POST /v1/systemone`"
      why: "client: a decision model, not chat"
      client: true
    - {class: REQUIRED, flag: "--embedding", source: "nace-ai/drex-dlm-Q8_0 README.md:L22", quote: "use `--embedding --pooling none -c 16384 -b 16384 -ub 16384 -np 1 --no-warmup` for the tested native configuration", why: "the card's tested native configuration"}
    - {class: REQUIRED, flag: "--pooling", value: "none", source: "nace-ai/drex-dlm-Q8_0 README.md:L22", quote: "--embedding --pooling none", why: "the decision head reads per-token states (no pooling)"}
    - {class: RECOMMENDED, flag: "--ctx-size", value: "16384", source: "nace-ai/drex-dlm-Q8_0 README.md:L22", quote: "The recommended serving context is 16,384 tokens; the model's maximum position window is 32,768 tokens.", why: "the card's serving context"}
    - {class: REQUIRED, flag: "--batch-size", value: "${ctx}", source: "nace-ai/drex-dlm README.md:L255", quote: "Raise the encode cap (`SYSTEMONE_CONTEXT`) and the slot size (`-c`, `-b`, `-ub`) together:", why: "-b must equal -c: the whole request is one batch"}
    - {class: REQUIRED, flag: "--ubatch-size", value: "${ctx}", source: "nace-ai/drex-dlm README.md:L255", quote: "Raise the encode cap (`SYSTEMONE_CONTEXT`) and the slot size (`-c`, `-b`, `-ub`) together:", why: "-ub must equal -c: the bidirectional state is evaluated in one micro-batch"}
    - {class: REQUIRED, flag: "--parallel", value: "1", source: "nace-ai/drex-dlm-Q8_0 README.md:L22", quote: "-np 1 --no-warmup", why: "one slot holds the whole window (the tested configuration)"}
    - {class: RECOMMENDED, flag: "--no-warmup", source: "nace-ai/drex-dlm-Q8_0 README.md:L22", quote: "-np 1 --no-warmup", why: "the tested configuration skips the warmup run"}
    - {class: REQUIRED, flag: "@env", value: "SYSTEMONE_CONTEXT=${ctx} when ctx > 16384", source: "nace-ai/drex-dlm README.md:L247", quote: "Every runner defaults to **16,384**; the full window must be enabled explicitly.", why: "the fork's encode cap is 16,384 unless SYSTEMONE_CONTEXT raises it"}
  native_ctx:
    value: 32768
    source: "nace-ai/drex-dlm-Q8_0 README.md:L22"
    quote: "the model's maximum position window is 32,768 tokens"

