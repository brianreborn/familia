      quote: "By default, LFM2.5 writes Pythonic function calls (a Python list between `<|tool_call_start|>` and `<|tool_call_end|>` special tokens)"
      why: "client: tool calls are Pythonic, not JSON; llama-server's --jinja LFM2 parser reads them only with the repo template"
      client: true

