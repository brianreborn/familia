gotchas:
  - "The open nvidia.ko (615 series) logs a GSP 'not supported' warning for G84; harmless, the legacy DKMS module drives the card."
  - "EGL/GBM unavailable without Mesa DRI, so no hardware GL compositor."
  - "nouveau grabbed the card at boot and the 340 module could not probe it; fixed 2026-10-19 with /etc/modprobe.d/blacklist-nouveau.conf + rd.driver.blacklist=nouveau + dracut -f (nvidia-smi 340.108 OK; display falls back to low-res)."
  - "Treat the GPU as a decision-model side unit at most (256 MiB); every LLM role on this host is CPU + RAM bound."
