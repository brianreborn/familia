known_good_setup:
  - "Display: GDM is Wayland-only on EL10 and native Xorg is gone; Weston 14 with --backend=drm --renderer=pixman as a user systemd service works (LESSONS-LEARNED.md L-nvidia340)."
  - "CUDA driver API works on the legacy stack: cuInit(0)=0, one device, CC 1.1 (LESSONS-LEARNED.md L-nvidia340). No stock llama.cpp backend supports sm_11; only familia gpu-legacy (hand-written PTX) can use it."
