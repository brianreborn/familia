[pytest]
# familia's own tests only. Pinned parts (pins.txt) are separate checkouts with their own
# test suites and dependencies; `run-tests.sh -q -x` (options but no path) must not collect them.
testpaths = tests
norecursedirs = .* .cache build* code-bootstraps-llama.cpp agent-reach green-roomz green-agentz green-agency llama-server__* node_modules
# Proving grounds (top-level, environment/fleet-dependent, graded) are excluded from the
# default pass/fail run. Run them with: pytest -m proving_ground  (or scripts/proving_grounds.sh).
markers =
    proving_ground: top-level graded check that depends on the local host/fleet; not a pass/fail gate
addopts = -m "not proving_ground"
