[pytest]
# familia's own tests only. Pinned parts (pins.txt) are separate checkouts with their own
# test suites and dependencies; `run-tests.sh -q -x` (options but no path) must not collect them.
testpaths = tests
norecursedirs = .* .cache build* code-bootstraps-llama.cpp agent-reach green-roomz green-agentz green-agency llama-server__* node_modules
