<!--
# FAMILIA Logo - Morning Glory + Marian Theme
## Design Vision & Notes

### The Core Metaphor:
Morning glory vines are climbing plants that reach upward and outward, connecting to whatever they touch.
They bloom each morning with trumpet-shaped flowers in blues and purples—then close by afternoon.
This mirrors familia: a living network that grows organically, connects machines and models, and is alive with activity.

### What You're Seeing:

1. **Two Winding Vines** (blue-purple gradient)
   - These represent the graph topology—the connections between your agents, models, and machines
   - They don't go straight; they curve and reach, like real vines seeking light
   - The gradient from blue to purple suggests depth and growth

2. **Three Morning Glory Flowers** (pink/purple with golden centers)
   - Each flower is a "node" in your graph—a model, an agent, a machine
   - The trumpet shape is the classic morning glory silhouette
   - Golden centers represent the "spark" or intelligence within each node

3. **8-Pointed Marian Star** (above the text, blue with gold center)
   - Traditional symbol of Mary in Christian art—the "Stella Maris" (Star of the Sea)
   - Represents guidance, protection, and the "mother" aspect of familia
   - The 8 points symbolize the directions of growth—outward in all directions
   - Gold center ties it to the flowers' centers

4. **The Name "familia"**
   - Clean, bold text anchors the design
   - The tagline "your models · your machines · one graph" explains what it is

### Why Morning Glory + Marian?
- Morning glories are humble, everyday flowers—familia is for everyday use
- They bloom fresh each day—your graph is always alive and growing
- The Marian star adds a layer of care and guidance—like a mother watching over her children (your agents/models)

### The Feeling:
It should feel organic, warm, and alive—not corporate or sterile.
Like something that grows in your garden but also has purpose and structure.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Morning glory gradient -->
    <linearGradient id="vineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
