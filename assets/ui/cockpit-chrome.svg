<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>familia ui_bridge / llama-ui cockpit chrome</title>
<desc>Static chrome matching scripts/ui_bridge.py sections plus open_ui.sh browser frame. Example values labeled as example.</desc>
<rect width="1280" height="720" fill="#f7f7f2" stroke="#333" stroke-width="2"/>
<text x="36" y="32" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111">familia - cockpit chrome (ui_bridge + llama-ui)</text>
<text x="36" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#444">Left: scripts/ui_bridge.py terminal HUD. Right: browser frame opened by scripts/open_ui.sh. Default FAMILIA_UI_URL=http://127.0.0.1:9941.</text>

<!-- LEFT: terminal HUD frame -->
<rect x="36" y="80" width="580" height="520" rx="8" fill="#1a1a1a" stroke="#00afaf" stroke-width="2"/>
<text x="52" y="108" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00ffff">================================================================</text>
<text x="52" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#00ff00">  FAMILIA PROTOMODEL / LLAMA-UI LIVE COCKPIT</text>
<text x="52" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#80ffff">  (http://127.0.0.1:9941/)</text>
<text x="52" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00ffff">================================================================</text>

<text x="52" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Model Alias:</text>
<text x="180" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#dddddd">coder (Q4_K_M)   [example]</text>
<text x="52" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Weights File:</text>
<text x="180" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#dddddd">qwen35-2b-q4km.gguf   [example]</text>
<text x="52" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Web UI:</text>
<text x="180" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#dddddd">Enabled (Svelte bundle active)</text>

<text x="52" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd700">--- Active Engine Slots ---</text>
<text x="52" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cccccc">  Slot #0 | Context: 65536 tokens | Speculative: True | Status:</text>
<text x="52" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#00ff00">  IDLE</text>
<text x="100" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cccccc">(Task -)   [example props/slots]</text>

<text x="52" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd700">--- Exposed Routes &amp; Endpoints ---</text>
<text x="52" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cccccc">  - coder           [capabilities: chat]</text>
<text x="52" y="416" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#cccccc">  - general         [capabilities: chat]</text>
<text x="52" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#888888">  (from GET /v1/models; mid and caps are example)</text>

<text x="52" y="480" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#00ffff">----------------------------------------------------------------</text>
<text x="52" y="504" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#888888">  To view in browser, run: sh scripts/open_ui.sh</text>
<text x="52" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#888888">  or visit: http://127.0.0.1:9941/</text>
<text x="52" y="548" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#00ffff">================================================================</text>

<text x="52" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#888888">Fetches: GET /props, GET /slots, GET /v1/models</text>
<text x="52" y="598" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#888888">Keys: model_alias, model_ftype, model_path, ui; slot id/n_ctx/speculative/is_processing/id_task</text>

<!-- RIGHT: browser chrome -->
<rect x="650" y="80" width="590" height="520" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
